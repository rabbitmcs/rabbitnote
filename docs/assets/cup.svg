<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -90 240 310"><style>
.ring{fill:none;stroke:#8f6a4c;stroke-width:2.500;transform-origin:108px 108px;transform:scale(.08);opacity:0;animation:ripple 7s linear infinite}
.r2{animation-delay:2.300s}.r3{animation-delay:4.600s}
@keyframes ripple{0%{transform:scale(.08);opacity:0}8%{opacity:.85}70%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}
.steam{fill:#fff;opacity:0;animation:rise 6s ease-in-out infinite}
.s2{animation-delay:2s}.s3{animation-delay:4s}
@keyframes rise{0%{transform:translate(0,34px) scaleY(.7);opacity:0}25%{opacity:.34}70%{opacity:.16}100%{transform:translate(9px,-62px) scaleY(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring,.steam{animation:none}}
</style>
